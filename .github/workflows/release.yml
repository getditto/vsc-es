name: release
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

# Least-privilege default: `contents: read` is enough for checkout (this is
# a private repo — GITHUB_TOKEN needs at least read to authenticate the
# clone). Only the `release` job below is escalated to `contents: write`,
# for the GitHub Release it creates.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi

      - name: Verify release notes file exists
        shell: bash
        run: |
          NOTES="docs/releases/${GITHUB_REF_NAME}.md"
          if [ ! -f "$NOTES" ]; then
            echo "Release notes missing: $NOTES"
            echo "Create the file (see docs/releases/TEMPLATE.md) and re-tag."
            exit 1
          fi

  matrix:
    needs: verify
    uses: ./.github/workflows/_build-matrix.yml
    with:
      depth: e2e
    secrets:
      DITTO_CI_DATABASE_ID: ${{ secrets.DITTO_CI_DATABASE_ID }}
      DITTO_CI_DEVELOPMENT_TOKEN: ${{ secrets.DITTO_CI_DEVELOPMENT_TOKEN }}
      DITTO_CI_URL: ${{ secrets.DITTO_CI_URL }}

  release:
    needs: matrix
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all VSIX artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ditto-vsce-*
          path: artifacts

      - name: Flatten artifacts into a single dir
        shell: bash
        run: |
          mkdir -p release-assets
          find artifacts -name '*.vsix' -exec mv {} release-assets/ \;
          ls release-assets

      # No `cache: npm`, and `package-manager-cache` (setup-node v5+'s
      # separate, default-ON auto-cache keyed off package.json) explicitly
      # disabled — this job publishes the release artifact, and restoring a
      # shared dependency cache into a job that publishes public output is a
      # cache-poisoning vector. It's one `npm ci` for a single-purpose CLI,
      # not worth the tradeoff.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      - run: npm ci

      # CycloneDX SBOM from package-lock.json, attached to the release
      # alongside the VSIXes — for customers whose procurement requires one.
      - name: Generate SBOM
        run: npx @cyclonedx/cyclonedx-npm --output-file "release-assets/ditto-vsce-${REF_NAME}.cdx.json"
        env:
          REF_NAME: ${{ github.ref_name }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          files: |
            release-assets/*.vsix
            release-assets/*.cdx.json
          fail_on_unmatched_files: true
          prerelease: false
