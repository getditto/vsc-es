name: validate

# The gate that runs on every change. `build-and-validate.yml` is
# workflow_dispatch-only and produces signed per-target VSIXes plus the
# Extension-Development-Host integration suites — that is release machinery, too
# slow and too credential-dependent to sit on a pull request. This job is the
# cheap half: types, lint, unit tests, and a bundle that actually links.
#
# esbuild strips types without checking them, so `npm run build` passing tells
# you nothing about type correctness. `typecheck` is therefore not redundant
# with `build` — it is the only thing standing between a type error and a
# release.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A new push supersedes the previous run for the same ref.
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # Run the three checks as separate steps rather than via `npm run
      # validate` so a failure names itself in the job summary instead of
      # requiring someone to open the log. `if: always()` so one failure
      # doesn't hide the other two — a PR author should see every problem in
      # one pass.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        if: always()
        run: npm run lint

      - name: Unit tests
        if: always()
        run: npm test

      # Dependabot alerts lag a PR by hours; this fails same-day on any
      # dependency the PR itself introduces or bumps into a known-high/
      # critical CVE. --omit=dev matches what actually ships in the VSIX
      # (esbuild bundles everything except @dittolive/ditto).
      - name: Dependency audit
        if: always()
        run: npm run audit

      # Unused files/exports/dependencies — the codebase equivalent of the
      # coverage gate below, but for dead weight instead of untested code.
      - name: Knip
        if: always()
        run: npm run knip

      # Fails if a production dependency's license isn't on the allow-list —
      # catches a copyleft license riding in transitively before it ships in
      # a proprietary VSIX.
      - name: License check
        if: always()
        run: npm run license-check

      # The coverage gate reconciles node's loaded-files-only report against
      # the real source tree (never-loaded files count as 0%) and enforces
      # ≥85% lines over all runtime files; exclusions are documented in
      # scripts/check-coverage.mjs. Re-runs the suite with V8 coverage on.
      - name: Coverage gate
        if: always()
        run: npm run coverage

      # Catches the failures typechecking cannot: a missing entry point, a
      # bundler-resolution error, an asset the build script expects to copy.
      - name: Build
        if: always()
        run: npm run build
