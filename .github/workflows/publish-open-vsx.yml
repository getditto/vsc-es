name: Publish to Open VSX

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published GitHub Release tag (for example, v0.96.1)'
        required: true
        type: string
      publish:
        description: 'Upload the verified packages to Open VSX'
        type: boolean
        default: false
      create_namespace:
        description: 'Create the selected namespace if it is missing'
        type: boolean
        default: false
      namespace:
        description: 'Namespace to check'
        type: choice
        options:
          - ditto
          - DittoLive
        default: ditto

permissions:
  contents: read

concurrency:
  group: open-vsx-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && !inputs.create_namespace
    runs-on: ubuntu-24.04
    steps:
      - name: Download and verify release packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Enter a stable release tag in the form vMAJOR.MINOR.PATCH.' >&2
            exit 1
          fi
          packages="$RUNNER_TEMP/open-vsx-packages"
          metadata="$RUNNER_TEMP/open-vsx-release.json"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,assets > "$metadata"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'ditto-vsce-*.vsix' --dir "$packages"

          python3 - "$metadata" "$packages" "$RELEASE_TAG" <<'PY'
          import hashlib
          import json
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from zipfile import ZipFile

          metadata_path, packages_dir, tag = sys.argv[1:]
          release = json.loads(Path(metadata_path).read_text())
          if release['tagName'] != tag or release['isDraft'] or release['isPrerelease']:
              sys.exit(f'{tag} must be a published stable GitHub Release.')

          version = tag[1:]
          targets = ('darwin-arm64', 'linux-arm64', 'linux-x64', 'win32-x64')
          expected = {f'ditto-vsce-{target}-{version}.vsix': target for target in targets}
          packages = {path.name: path for path in Path(packages_dir).glob('*.vsix')}
          if packages.keys() != expected.keys():
              sys.exit(f'Expected these packages: {", ".join(expected)}. Found: {", ".join(sorted(packages))}.')

          assets = {asset['name']: asset for asset in release['assets']}
          for name, target in expected.items():
              path = packages[name]
              with path.open('rb') as stream:
                  digest = hashlib.file_digest(stream, 'sha256').hexdigest()
              asset = assets.get(name, {})
              if asset.get('state') != 'uploaded' or asset.get('digest') != f'sha256:{digest}':
                  sys.exit(f'{name} failed GitHub Release digest verification.')

              with ZipFile(path) as package:
                  manifest = json.loads(package.read('extension/package.json'))
                  if (manifest.get('publisher'), manifest.get('name'), manifest.get('version')) != ('ditto', 'ditto-vsce', version):
                      sys.exit(f'{name} has an unexpected publisher, extension name, or version.')
                  identity = ET.fromstring(package.read('extension.vsixmanifest')).find('.//{*}Identity')
                  expected_identity = {
                      'Publisher': 'ditto', 'Id': 'ditto-vsce', 'Version': version, 'TargetPlatform': target,
                  }
                  if identity is None or any(identity.get(key) != value for key, value in expected_identity.items()):
                      sys.exit(f'{name} has an unexpected VSIX identity or target platform.')
                  native_dir = 'extension/node_modules/@dittolive/ditto/node/'
                  binaries = [entry for entry in package.namelist() if entry.startswith(native_dir) and entry.endswith('.node')]
                  if binaries != [f'{native_dir}ditto.{target}.node']:
                      sys.exit(f'{name} does not contain exactly one Ditto SDK binary for {target}.')
              print(f'Verified {name}')
          PY

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: inputs.publish
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install Open VSX CLI
        if: inputs.publish
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/open-vsx-cli" --ignore-scripts \
            --no-audit --no-fund --min-release-age=3 ovsx@1.4.0

      - name: Publish verified packages to Open VSX
        if: inputs.publish
        shell: bash
        env:
          OVSX_PAT: ${{ secrets.VSX_TOKEN }}
        run: |
          if [[ -z "$OVSX_PAT" ]]; then
            echo 'The VSX_TOKEN GitHub Actions secret is required to publish to Open VSX.' >&2
            exit 1
          fi
          ovsx="$RUNNER_TEMP/open-vsx-cli/node_modules/.bin/ovsx"
          "$ovsx" verify-pat ditto
          for package in "$RUNNER_TEMP/open-vsx-packages/"*.vsix; do
            "$ovsx" publish --skip-duplicate "$package"
          done

  check-token:
    if: github.ref == 'refs/heads/ci/open-vsx-token-check' && !inputs.publish
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verify access and optionally create the Open VSX namespace
        shell: bash
        env:
          OVSX_PAT: ${{ secrets.VSX_TOKEN }}
          CREATE_NAMESPACE: ${{ inputs.create_namespace }}
          OVSX_NAMESPACE: ${{ inputs.namespace }}
        run: |
          node --input-type=module <<'JS'
          const registry = 'https://open-vsx.org';
          const token = process.env.OVSX_PAT;
          const namespace = process.env.OVSX_NAMESPACE;

          function fail(message) {
            console.error(message);
            process.exit(1);
          }

          if (!token) {
            fail('The VSX_TOKEN secret is unavailable to this workflow.');
          }
          if (namespace !== 'ditto' && namespace !== 'DittoLive') {
            fail('Select ditto or DittoLive as the Open VSX namespace.');
          }

          function request(path, options = {}) {
            return fetch(registry + path, {
              ...options,
              headers: { Authorization: `Bearer ${token}`, ...options.headers },
              redirect: 'error',
              signal: AbortSignal.timeout(15_000),
            }).catch(() => fail('The request to Open VSX failed.'));
          }

          async function verifyAccess() {
            const response = await request(`/api/${namespace}/verify-pat`);
            if (response.status === 200) return true;
            if (response.status === 404) {
              const result = await response.json().catch(() => null);
              if (result?.error === `Namespace not found: ${namespace}`) return false;
            }
            fail(`Open VSX could not verify publishing access to ${namespace} (HTTP ${response.status}).`);
          }

          if (await verifyAccess()) {
            console.log(`The ${namespace} namespace already exists and the token can publish there.`);
          } else if (process.env.CREATE_NAMESPACE !== 'true') {
            console.log(`Open VSX accepted the token. The ${namespace} namespace does not exist.`);
          } else {
            console.log(`The ${namespace} namespace is missing. Requesting its creation.`);
            const response = await request('/api/-/namespace/create', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ name: namespace }),
            });

            if (response.status === 201) {
              console.log(`Open VSX created the ${namespace} namespace.`);
            } else {
              const result = await response.json().catch(() => null);
              const error = typeof result?.error === 'string' ? result.error : '';
              if (error.toLowerCase() === `Namespace already exists: ${namespace}`.toLowerCase()) {
                console.log(`The ${namespace} namespace was created after the initial check.`);
              } else if (response.status === 401 || error === 'Invalid access token.') {
                fail(`Open VSX rejected the token for namespace creation (HTTP ${response.status}).`);
              } else if (/publisher agreement/i.test(error)) {
                fail(`Open VSX requires the token owner to sign the Publisher Agreement (HTTP ${response.status}).`);
              } else {
                fail(`Open VSX refused to create the ${namespace} namespace (HTTP ${response.status}).`);
              }
            }

            if (!(await verifyAccess())) fail(`Open VSX still reports that the ${namespace} namespace is missing.`);
            console.log(`Open VSX confirmed that the token can publish to ${namespace}.`);
          }
          JS
