name: Publish to Open VSX

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published GitHub Release tag (for example, v0.96.1)'
        required: true
        type: string
      publish:
        description: 'Upload the verified packages to Open VSX'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: open-vsx-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: release
        uses: ./.github/actions/verify-release-packages
        with:
          tag: ${{ inputs.tag }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: inputs.publish
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install Open VSX CLI
        if: inputs.publish
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/open-vsx-cli" --ignore-scripts \
            --no-audit --no-fund --min-release-age=3 ovsx@1.4.0

      - name: Publish verified packages to Open VSX
        if: inputs.publish
        shell: bash
        env:
          PACKAGES: ${{ steps.release.outputs.directory }}
          OVSX_PAT: ${{ secrets.VSX_TOKEN }}
        run: |
          if [[ -z "$OVSX_PAT" ]]; then
            echo 'The VSX_TOKEN GitHub Actions secret is required to publish to Open VSX.' >&2
            exit 1
          fi
          ovsx="$RUNNER_TEMP/open-vsx-cli/node_modules/.bin/ovsx"
          "$ovsx" verify-pat DittoLive
          for package in "$PACKAGES/"*.vsix; do
            "$ovsx" publish --skip-duplicate "$package"
          done
