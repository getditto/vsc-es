name: build-and-validate
on:
  workflow_dispatch:
    inputs:
      depth:
        description: 'Validation depth'
        type: choice
        options: [package, load, e2e]
        default: e2e

jobs:
  matrix:
    permissions:
      contents: read
    uses: ./.github/workflows/_build-matrix.yml
    with:
      depth: ${{ inputs.depth }}
    secrets: inherit
