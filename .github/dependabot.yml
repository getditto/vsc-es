version: 2
updates:
  # Routine version drift for npm dependencies. Known-vulnerable versions are
  # already covered separately by GitHub's Dependabot security updates
  # (repo Settings → Code security) regardless of this file — this config is
  # for ordinary updates that never rise to a CVE.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Don't auto-open a PR for a version the moment it is published: the
    # hijacked-package playbook is to publish a malicious release and rely on
    # automation to pull it in before anyone looks. Dependabot's implicit
    # default is only 3 days. This applies to VERSION updates only — security
    # updates open immediately, so CVE fixes are never delayed. Same threat
    # model as `min-release-age` in .npmrc, one layer up.
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 7
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  # Keeps third-party Actions current. If/when a workflow pins an action to a
  # commit SHA rather than a tag, Dependabot still resolves version bumps and
  # updates the trailing version comment in the same PR.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # Same cooldown reasoning as npm above, and it matters more here: a
    # compromised action runs inside CI with this repo's token.
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 7
    groups:
      actions:
        patterns:
          - "*"
