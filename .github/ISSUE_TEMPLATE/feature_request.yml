name: Feature Request
description: Suggest a new capability or improvement for Ditto Edge Studio.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to propose an idea!

        **Before you submit**, please check that the feature hasn't already
        been requested in the
        [open issues](https://github.com/getditto/vsc-es/issues).

        Concrete use cases make features much easier to evaluate, so the
        more grounded in real workflow the better.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: |
        Describe the user need or workflow. Skip "I want X" and tell us
        "When I'm doing Y, I have to Z, which is painful because…"
      placeholder: |
        When I'm reviewing query results from a 10k-row table, I have to
        manually scroll because the table doesn't remember my last
        position when I switch tabs and come back.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like this to work?
      placeholder: |
        The Query Editor could persist scroll/selection state per tab so
        switching away and back lands me where I left off.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds did you try? Other approaches you considered?
      placeholder: "I tried … but it doesn't work because …"

  - type: dropdown
    id: priority
    attributes:
      label: How important is this to you?
      options:
        - "Nice to have — improves the experience but I can work around it"
        - "Important — would significantly improve my workflow"
        - "Blocker — I can't ship/use the extension without it"
    validations:
      required: true

  - type: input
    id: extension-version
    attributes:
      label: Ditto Edge Studio version
      description: Find this on the extension's tile in the Extensions sidebar.
      placeholder: "e.g. 0.0.1"

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: |
        Mockups, screenshots, links to related issues, references to how
        other tools solve this — anything that helps us picture the
        change. (Optional)
